services:
  mongodb:
    image: mongo:6.0
    container_name: notification-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: notificationsystem
    networks:
      - notification-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./server/dockerfile
    container_name: notification-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DOCKER_ENV=true
      - MONGODB_URI=mongodb://mongodb:27017/notificationsystem
    env_file:
      - .env
    volumes:
      # Mount templates.json so it's accessible from host and container
      - ./templates.json:/app/templates.json
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - notification-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: notification-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - notification-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  notification-network:
    driver: bridge
