services:
  mongodb:
    image: mongo:6.0
    container_name: notification-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
      - mongodb_config_dev:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: notificationsystem
    networks:
      - notification-network-dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./server/dockerfile
    container_name: notification-server-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/notificationsystem
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - notification-network-dev
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  mailhog:
    image: mailhog/mailhog:latest
    container_name: notification-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - notification-network-dev

volumes:
  mongodb_data_dev:
    driver: local
  mongodb_config_dev:
    driver: local

networks:
  notification-network-dev:
    driver: bridge

